<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bone Text Tones</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--ink-1);height:100%;font-family:var(--font-body);color:var(--bone)}
  .wrap{padding:28px 32px;display:flex;flex-direction:column;gap:14px;height:100%;box-sizing:border-box;justify-content:center}
  .row{display:grid;grid-template-columns:120px 1fr 110px;align-items:center;gap:18px}
  .sw{width:64px;height:24px;border-radius:6px;border:1px solid var(--line)}
  .lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--bone-3)}
  .txt{font-family:var(--font-display);font-weight:600;font-size:18px;letter-spacing:-.01em}
  .hex{font-family:var(--font-mono);font-size:11px;color:var(--bone-3);text-align:right}
</style>
</head>
<body>
<div class="wrap">
  <div class="row"><div style="display:flex;align-items:center;gap:14px"><div class="sw" style="background:#F4F2EC"></div><div class="lbl">bone</div></div><div class="txt" style="color:#F4F2EC">Become the ultimate human.</div><div class="hex">#F4F2EC</div></div>
  <div class="row"><div style="display:flex;align-items:center;gap:14px"><div class="sw" style="background:#B8B5AB"></div><div class="lbl">bone-2</div></div><div class="txt" style="color:#B8B5AB;font-weight:500">Secondary copy and supporting paragraphs.</div><div class="hex">#B8B5AB</div></div>
  <div class="row"><div style="display:flex;align-items:center;gap:14px"><div class="sw" style="background:#6E6B62"></div><div class="lbl">bone-3</div></div><div class="txt" style="color:#6E6B62;font-weight:500;font-size:14px;font-family:var(--font-mono);letter-spacing:.16em;text-transform:uppercase">— The system · captions · eyebrows</div><div class="hex">#6E6B62</div></div>
  <div class="row"><div style="display:flex;align-items:center;gap:14px"><div class="sw" style="background:#3F3D38"></div><div class="lbl">bone-4</div></div><div class="txt" style="color:#3F3D38">Disabled / locked content.</div><div class="hex">#3F3D38</div></div>
</div>
</body>
</html>
