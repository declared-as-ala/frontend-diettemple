<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Type — Display</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--ink-1);height:100%}
  .wrap{padding:28px 36px;display:flex;flex-direction:column;justify-content:center;gap:18px;height:100%;box-sizing:border-box}
  .spec{font-family:var(--font-mono);font-size:9px;letter-spacing:.2em;color:var(--bone-3);text-transform:uppercase}
  .hero{font-family:var(--font-display);font-weight:800;font-size:88px;line-height:.88;letter-spacing:-.05em;text-transform:uppercase;color:var(--bone);margin:0}
  .hero em{font-style:normal;color:var(--volt)}
  .display{font-family:var(--font-display);font-weight:700;font-size:34px;line-height:1.02;letter-spacing:-.025em;color:var(--bone-2);margin:0}
</style>
</head>
<body>
<div class="wrap">
  <div class="spec">— Manrope · 800 · -0.05em · upper · 88/0.88</div>
  <h1 class="hero">Become the <em>ultimate</em> human.</h1>
  <div class="spec" style="margin-top:6px">— Manrope · 700 · -0.025em · 34/1.02</div>
  <p class="display">A transformation, engineered.</p>
</div>
</body>
</html>
