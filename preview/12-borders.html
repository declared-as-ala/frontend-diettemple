<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Borders & Hairlines</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--ink-1);height:100%;color:var(--bone);font-family:var(--font-body)}
  .wrap{padding:24px;height:100%;box-sizing:border-box;display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-items:center}
  .b{background:var(--ink-2);border-radius:12px;height:130px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;position:relative}
  .b .lbl{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.16em;color:var(--bone-3);text-transform:uppercase;text-align:center}
  .b .v{font-family:var(--font-display);font-weight:600;font-size:13px;color:var(--bone)}
  .b1{border:1px solid var(--line)}
  .b2{border:1px solid var(--line-strong)}
  .b3{border:1px solid var(--volt);box-shadow:0 0 0 4px rgba(200,255,61,.16)}
  .b4{border-top:1px solid var(--line);background:transparent;height:130px;justify-content:flex-start;padding-top:24px}
</style>
</head>
<body>
<div class="wrap">
  <div class="b b1"><div class="v">— hairline</div><div class="lbl">rgba(255,255,255,.08)</div></div>
  <div class="b b2"><div class="v">— strong</div><div class="lbl">rgba(255,255,255,.14) · hover</div></div>
  <div class="b b3"><div class="v">— active</div><div class="lbl">volt · +4px glow</div></div>
  <div class="b b4"><div class="v">— section divider</div><div class="lbl">1px top, no fill</div></div>
</div>
</body>
</html>
