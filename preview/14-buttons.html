<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Buttons</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--ink-1);height:100%;color:var(--bone)}
  .wrap{padding:26px;height:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:18px;justify-content:center}
  .row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .btn{height:48px;padding:0 24px;border-radius:999px;font-family:var(--font-display);font-weight:600;font-size:14px;letter-spacing:.04em;display:inline-flex;align-items:center;gap:8px;border:1px solid transparent;cursor:pointer;transition:all 240ms cubic-bezier(.2,.7,.1,1)}
  .primary{background:var(--volt);color:var(--ink-0);box-shadow:0 0 0 0 rgba(200,255,61,.45),0 10px 30px -10px rgba(200,255,61,.4)}
  .ghost{background:transparent;color:var(--bone);border-color:var(--line-strong)}
  .pressed{background:var(--volt-deep);transform:scale(.98);opacity:.92}
  .arrow{width:14px;height:14px;display:inline-block;border:1.5px solid currentColor;border-left:0;border-bottom:0;transform:rotate(45deg);margin-left:2px}
  .seal{background:transparent;color:var(--champagne);border-color:rgba(216,201,163,.4)}
  .lbl{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.18em;color:var(--bone-3);text-transform:uppercase;min-width:90px}
</style>
</head>
<body>
<div class="wrap">
  <div class="row"><div class="lbl">primary</div><button class="btn primary">Join Ultimate Human<span class="arrow"></span></button><button class="btn primary" style="height:40px">Start</button></div>
  <div class="row"><div class="lbl">ghost</div><button class="btn ghost">Discover the System</button><button class="btn ghost" style="height:40px">Learn more</button></div>
  <div class="row"><div class="lbl">states</div><button class="btn primary pressed">Pressed</button><button class="btn ghost" style="border-color:var(--volt);box-shadow:0 0 0 4px rgba(200,255,61,.16)">Focused</button><button class="btn seal">Member · UH</button></div>
</div>
</body>
</html>
