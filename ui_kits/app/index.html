<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DietTemple — Mobile App</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<link rel="stylesheet" href="app.css">
<link rel="icon" type="image/webp" href="../../assets/logo.webp">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body data-screen-label="DietTemple App">
<div id="root"></div>

<script type="text/babel" src="Frame.jsx"></script>
<script type="text/babel" src="HomeScreen.jsx"></script>
<script type="text/babel" src="ScanScreen.jsx"></script>
<script type="text/babel" src="TrainScreen.jsx"></script>
<script type="text/babel" src="ProgressScreen.jsx"></script>
<script type="text/babel" src="CoachScreen.jsx"></script>

<script type="text/babel">
const { useState, useEffect } = React;

function App() {
  const [tab, setTab] = useState('home');
  useEffect(() => {
    const id = setTimeout(() => window.lucide && lucide.createIcons(), 30);
    return () => clearTimeout(id);
  }, [tab]);

  const screens = {
    home:     <HomeScreen />,
    scan:     <ScanScreen />,
    train:    <TrainScreen />,
    progress: <ProgressScreen />,
    coach:    <CoachScreen />,
  };

  return (
    <div className="dta-stage">
      <div className="dta-stage-h">
        <div className="dta-stage-eb">— DietTemple · App UI Kit</div>
        <h1 className="dta-stage-t">The instrument.</h1>
        <p className="dta-stage-s">The temple in your pocket. Click any tab to navigate. The scanner is the hero interaction — that's the temple's gateway to your biology.</p>
      </div>
      <div className="dta-tabs">
        {[
          ['home','home','Home'],
          ['train','dumbbell','Train'],
          ['scan','scan-line','Scan'],
          ['progress','line-chart','Progress'],
          ['coach','message-circle','Coach'],
        ].map(([id, ic, lbl]) => (
          <button key={id} className={tab === id ? 'on' : ''} onClick={() => setTab(id)}>
            <i data-lucide={ic}></i>{lbl}
          </button>
        ))}
      </div>
      <Frame tab={tab} onTab={setTab}>
        {screens[tab]}
      </Frame>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
